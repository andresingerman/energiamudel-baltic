<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slider designs</title>
<!-- A separate bench of slider designs for the panel's source rows (the owner asked, 2026-10-21): nothing here is in
     the application. The rows copy the panel's as it is on main 890c179 — icon, label with its change from the
     reference year, slider, MW tile, bid tile — and only the slider differs between the cards. Served from the
     repository's root so that the application's fonts load: see README.md beside this file. -->
<style>
@font-face { font-family: "D-DIN"; src: url("../../app/public/fonts/D-DIN.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "D-DIN"; src: url("../../app/public/fonts/D-DIN-Bold.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "JetBrains Mono"; src: url("../../app/public/fonts/jetbrains-mono-latin.woff2") format("woff2"); font-weight: 100 800; }
:root {
  --bg: #0A0E12; --surface: #141A1F; --surface2: #1D2328; --line: #2E363D;
  --ink: #F0F0FA; --muted: #A3ADB7; --accent: #5AC8FA; --amber: #F5B841; --green: #3DD68C; --red: #FF5A52; --on-accent: #0A0E12;
  --radius: 4px; --text: "D-DIN", "Helvetica Neue", Arial, sans-serif; --num: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #FFFFFF; --surface: #F3F5F7; --surface2: #E6EAEE; --line: #C9D0D6;
  --ink: #10151A; --muted: #4B5661; --accent: #0B6699; --amber: #8A5700; --green: #0D7340; --red: #B3261E; --on-accent: #FFFFFF; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #FFFFFF; --surface: #F3F5F7; --surface2: #E6EAEE; --line: #C9D0D6;
  --ink: #10151A; --muted: #4B5661; --accent: #0B6699; --amber: #8A5700; --green: #0D7340; --red: #B3261E; --on-accent: #FFFFFF; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 14px/1.4 var(--text); }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 14px; }
h1 { font-size: 16px; margin: 0; }
.note { color: var(--muted); font-size: 12px; margin: 2px 0 0; max-width: 70ch; }
.tools button { border: 1px solid var(--line); background: var(--surface2); color: var(--ink); border-radius: 14px; padding: 4px 12px; cursor: pointer; font: inherit; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap: 14px; }
.box { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; background: var(--bg); }
.box > h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 2px; font-weight: 700; }
.box > p { color: var(--muted); font-size: 12px; margin: 0 0 8px; }

/* the panel's source row, as on main */
.row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto 52px; gap: 2px 8px; align-items: center; margin: 8px 0; }
.big { grid-column: 1; grid-row: 1 / span 2; line-height: 0; color: var(--accent); }
.lbl-line { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; min-width: 0; }
.gr { font: 11px var(--num); white-space: nowrap; color: var(--muted); }
.gr.up { color: var(--green); } .gr.down { color: var(--red); }
.rng { grid-column: 2; position: relative; display: flex; align-items: center; gap: 6px; min-height: 22px; }
.tile, .bid { grid-row: 1 / span 2; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface2); line-height: 1.15; padding: 2px 6px; }
.tile { grid-column: 3; min-width: 64px; } .bid { grid-column: 4; }
.tile b, .bid b { font: 700 15px/1.15 var(--num); } .tile span, .bid span { font-size: 9px; color: var(--muted); }
.tile.changed { border-color: var(--amber); } .tile.changed b { color: var(--amber); }

input[type="range"] { width: 100%; margin: 0; }

/* A — today: the browser's own slider in the accent, the reference a tick */
.v-a input { accent-color: var(--accent); }
.v-a .tick { position: absolute; top: 2px; width: 2px; height: 16px; background: var(--muted); left: calc(7px + (100% - 16px) * var(--r)); pointer-events: none; }

/* every custom design starts from a bare track */
.c input { -webkit-appearance: none; appearance: none; background: transparent; height: 22px; cursor: pointer; }
.c input::-webkit-slider-runnable-track { height: var(--th); border-radius: var(--tr, 0); background: var(--track); }
.c input::-moz-range-track { height: var(--th); border-radius: var(--tr, 0); background: var(--track); }
.c input::-webkit-slider-thumb { -webkit-appearance: none; width: var(--kw); height: var(--kh); margin-top: calc((var(--th) - var(--kh)) / 2); border: var(--kb, 0); border-radius: var(--kr, 50%); background: var(--kbg); box-shadow: var(--ks, none); }
.c input::-moz-range-thumb { width: var(--kw); height: var(--kh); border: var(--kb, 0); border-radius: var(--kr, 50%); background: var(--kbg); box-shadow: var(--ks, none); }

/* B — hairline: a 2 px line filled to the value, a small knob ringed in the page's colour */
.v-b { --th: 2px; --kw: 14px; --kh: 14px; --kbg: var(--accent); --kb: 3px solid var(--bg); --ks: 0 0 0 1px var(--accent); }
.v-b input { --track: linear-gradient(to right, var(--accent) var(--p), var(--line) var(--p)); }
.v-b .tick { position: absolute; top: 15px; width: 1px; height: 6px; background: var(--muted); left: calc(7px + (100% - 14px) * var(--r)); }

/* C — capsule: a thick rounded track filled to the value, a large light knob with a shadow (phones' habit) */
.v-c { --th: 8px; --tr: 4px; --kw: 20px; --kh: 20px; --kbg: #fff; --ks: 0 1px 4px rgb(0 0 0 / .45); }
.v-c input { --track: linear-gradient(to right, var(--accent) var(--p), var(--surface2) var(--p)); }
.v-c input::-webkit-slider-runnable-track { box-shadow: inset 0 0 0 1px var(--line); }
.v-c .tick { position: absolute; top: 9px; width: 4px; height: 4px; border-radius: 50%; background: var(--ink); opacity: .7; left: calc(8px + (100% - 20px) * var(--r)); }

/* D — ruler: a thin track over a scale of tenths, the reference a triangle under it */
.v-d { --th: 3px; --kw: 4px; --kh: 18px; --kr: 2px; --kbg: var(--accent); }
.v-d input { --track: linear-gradient(to right, var(--accent) var(--p), var(--line) var(--p)); }
.v-d .rng { padding-bottom: 8px; }
.v-d .rng::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 2px; height: 5px;
  background: repeating-linear-gradient(to right, var(--muted) 0 1px, transparent 1px 10%); opacity: .6; pointer-events: none; }
.v-d .tick { position: absolute; bottom: -4px; width: 0; height: 0; border: 5px solid transparent; border-bottom-color: var(--ink); left: calc(-3px + (100% - 4px) * var(--r)); }

/* E — change from the reference: the fill runs from the reference to the value, green up and red down */
.v-e { --th: 6px; --tr: 3px; --kw: 16px; --kh: 16px; --kbg: var(--ink); --kb: 2px solid var(--bg); }
.v-e input { --track: linear-gradient(to right, var(--surface2) var(--lo), var(--delta) var(--lo), var(--delta) var(--hi), var(--surface2) var(--hi)); }
.v-e input::-webkit-slider-runnable-track { box-shadow: inset 0 0 0 1px var(--line); }
.v-e .tick { position: absolute; top: 3px; width: 2px; height: 16px; background: var(--ink); left: calc(7px + (100% - 16px) * var(--r)); pointer-events: none; }

/* F — fill bar: no knob, the bar itself is the control; drag anywhere, the reference a line across */
.v-f { --th: 22px; --tr: var(--radius); --kw: 2px; --kh: 22px; --kr: 0; --kbg: var(--accent); }
.v-f input { --track: linear-gradient(to right, color-mix(in srgb, var(--accent) 35%, transparent) var(--p), var(--surface2) var(--p)); }
.v-f input::-webkit-slider-runnable-track { box-shadow: inset 0 0 0 1px var(--line); }
.v-f .tick { position: absolute; top: 0; bottom: 0; width: 1px; border-left: 1px dashed var(--ink); opacity: .6; left: calc(1px + (100% - 2px) * var(--r)); pointer-events: none; }

/* G — stepper: the hairline with − and + for one step each, easy with a thumb on a phone */
.v-g { --th: 2px; --kw: 14px; --kh: 14px; --kbg: var(--accent); --kb: 3px solid var(--bg); --ks: 0 0 0 1px var(--accent); }
.v-g input { --track: linear-gradient(to right, var(--accent) var(--p), var(--line) var(--p)); }
.v-g .step { flex: none; width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface2); color: var(--ink); font: 15px/1 var(--num); cursor: pointer; padding: 0; }
.v-g .tick { position: absolute; top: 15px; width: 1px; height: 6px; background: var(--muted); left: calc(28px + 7px + (100% - 56px - 14px) * var(--r)); }
</style>
</head>
<body>
<header>
  <div><h1>Slider designs — a separate bench</h1>
    <p class="note">Seven sliders for the panel's source rows; everything else in the row is as on the site. Drag them; the
      dark mark is the reference year's value, the tile turns amber when the value leaves the scenario's preset.</p></div>
  <div class="tools"><button type="button" id="theme">☀ | ☾</button></div>
</header>
<div class="grid" id="grid"></div>
<script>
const ROWS = [
  { name: "Maismaatuul", icon: '<path d="M12 7.6V2"/><path d="M13.2 9.7l4.9 2.8"/><path d="M10.8 9.7l-4.9 2.8"/><circle cx="12" cy="9" r="1.3"/><path d="M12 10.4V22"/><path d="M8.5 22h7"/>', ref: 694, preset: 1244, max: 2500, bid: 0 },
  { name: "Päikeseelektrijaamad", icon: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/>', ref: 1231, preset: 1785, max: 3600, bid: 0 },
  { name: "Põlevkivi, Auvere", icon: '<path d="M6.5 9.5 8.5 7l2 2 2-2.5 2 3 2-1.5"/><path d="M3.5 11h17l-2 5.5h-13z"/><circle cx="8.5" cy="19.2" r="1.7"/><circle cx="15.5" cy="19.2" r="1.7"/>', ref: 1240, preset: 270, max: 1400, bid: 213 },
];
const VARIANTS = [
  ["a", "A · today", "The browser's own slider in the accent colour; the reference a tick."],
  ["b", "B · hairline", "A 2 px line filled to the value and a small ringed knob: the lightest, the tiles carry the weight."],
  ["c", "C · capsule", "A thick rounded track and a large light knob, as on phones; easiest to grab, heaviest to look at."],
  ["d", "D · ruler", "A thin track over a scale of tenths, a slim upright knob, the reference a triangle under the track."],
  ["e", "E · change from the reference", "The fill runs from the reference year's value to the scenario's: green where it grows, red where it falls — the growth mark drawn."],
  ["f", "F · fill bar", "No knob: the bar is the control, its fill the value, the reference a dashed line; drag anywhere."],
  ["g", "G · stepper", "The hairline with − and + for a step each: exact moves with a thumb on a phone."],
];
const pct = (x) => `${(100 * x).toFixed(2)}%`;
function paint(input) {
  const r = ROWS[input.dataset.i], v = Number(input.value), row = input.closest(".row");
  const p = v / r.max, ref = r.ref / r.max;
  input.style.setProperty("--p", pct(p));
  row.style.setProperty("--r", ref.toFixed(4));
  row.style.setProperty("--lo", pct(Math.min(p, ref))); row.style.setProperty("--hi", pct(Math.max(p, ref)));
  row.style.setProperty("--delta", v >= r.ref ? "var(--green)" : "var(--red)");
  const g = (v - r.ref) / r.ref, mark = row.querySelector(".gr");
  mark.className = `gr${Math.abs(g) < 0.005 ? "" : g > 0 ? " up" : " down"}`;
  mark.textContent = Math.abs(g) < 0.005 ? "0 %" : `${g > 0 ? "▲" : "▼"} ${Math.round(Math.abs(g) * 100)} %`;
  row.querySelector(".tile b").textContent = v;
  row.querySelector(".tile").classList.toggle("changed", v !== r.preset);
}
document.getElementById("grid").innerHTML = VARIANTS.map(([k, title, about]) => `<section class="box ${k === "a" ? "" : "c "}v-${k}"><h2>${title}</h2><p>${about}</p>${
  ROWS.map((r, i) => `<div class="row"><span class="big"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${r.icon}</svg></span>
    <div class="lbl-line"><label for="s-${k}${i}">${r.name}</label><span class="gr"></span></div>
    <div class="rng">${k === "g" ? `<button type="button" class="step" data-d="-1" aria-label="${r.name}: one step down">−</button>` : ""}<input type="range" id="s-${k}${i}" data-i="${i}" min="0" max="${r.max}" step="1" value="${r.preset}"><span class="tick" aria-hidden="true"></span>${k === "g" ? `<button type="button" class="step" data-d="1" aria-label="${r.name}: one step up">+</button>` : ""}</div>
    <span class="tile"><b></b><span>MW</span></span><span class="bid"><b>${r.bid}</b><span>€/MWh</span></span></div>`).join("")}</section>`).join("");
for (const s of document.querySelectorAll("input[type=range]")) { paint(s); s.addEventListener("input", () => paint(s)); }
document.addEventListener("click", (e) => {
  const b = e.target.closest(".step"); if (!b) return;
  const s = b.parentElement.querySelector("input"); s.value = Number(s.value) + Number(b.dataset.d) * 10; paint(s);
});
document.getElementById("theme").addEventListener("click", () => {
  const root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === "dark" : !matchMedia("(prefers-color-scheme: light)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});
</script>
</body>
</html>
